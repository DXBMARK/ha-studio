name: codeql
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "17 4 * * 1"}]
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, actions: read}
    strategy:
      matrix: {language: [python, actions]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@eaec7bdd3f18a9ef62b9f0d85d410932cf58c886 # v3.38.2
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/analyze@eaec7bdd3f18a9ef62b9f0d85d410932cf58c886 # v3.38.2
        with: {category: "/language:${{ matrix.language }}"}
